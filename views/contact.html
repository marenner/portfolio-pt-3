<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Me</title>
        
        <link rel="icon" href="images/briefcase-icon.png">
        <link rel="stylesheet" href="styles/contact.css">
    </head>
    <h1 id="title">Contact Form</h1>
    <body>
        <form id="contact" action="#" method="get">
            <div id = "first-name">
                <label for="fname">First Name</label>
                <br>
                <input type="text" id="fname" name="fname">
            </div>
            <div id = "last-name">
                <label for="lname">Last Name</label>
                <br>
                <input type="text" id="lname" name="lname">
            </div>
            <div id = "job-title">
                <label for="job">Job Title</label>
                <br>
                <input type="text" id="job" name="job">
            </div>
            <div id = "company">
                <label for="comp">Company</label>
                <br>
                <input type="text" id="comp" name="comp">
            </div>
            <div id = "linkedin">
                <label for="linked">LinkedIn URL</label>
                <br>
                <input type="text" id="linked" name="linked">
            </div>
            <div id = "email-address">
                <label for="email">Email Address</label>
                <br>
                <input type="email" id="email" name="email">
            </div>

            <div id = "meeting">
                <label for="meet">How did we meet?</label>
                <br>
                <select id="meet" name="meet">
                    <option value="none">Please select</option>
                    <option value="inperson">In person</option>
                    <option value="online">Online</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div id="fill-in">
                <label for="fill">Other (please specify)</label>
                <br>
                <input type="text" id="fill" name="fill">
            </div>

            <div id="message">
                <label for="mess">Message</label>
                <br>
                <textarea rows="5" id="mess" name="mess"></textarea>
            </div>

            <div id="misc">
                <input type="checkbox" id="mailing-list" name="mailing-list" value="y">
                <label for="mailing-list">Please add me to your mailing list</label>

                <div id="format">
                    Choose an email format:
                    <input type="radio" id="html" name="form" value="html">
                    <label for="html">HTML</label>
                    <input type="radio" id="text" name="form" value="text">
                    <label for="text">Text</label>
                </div>

                <button type="submit" id="submit-button">Submit</button>
            </div>
        </form>
    </body>
</html>
